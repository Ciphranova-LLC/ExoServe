<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>{% block title %}ExoServe{% endblock %}</title>
        <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" />

        <link href="{{ url_for('static', filename='css/variables.css') }}" rel="stylesheet" />
        <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet" />
        <link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet" />

        <script src="{{ url_for('static', filename='js/network.js') }}" defer></script>
        <script src="{{ url_for('static', filename='js/key-handler.js') }}" defer></script>
        <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
    </head>

    <body>
        <!-- Hero Logo -->
        <div class="hero-logo">
            <a href="/#">
                <img src="static/img/hero.svg" alt="ExoServe Logo" />
            </a>
        </div>

        <!-- Main Page Layout -->
        <div class="page-layout">
            <!-- Login Box -->
            <div class="login-wrapper">
                <div class="login-box">
                    <img src="static/img/logo.svg" alt="Logo" class="login-logo" />
                    <h3 class="login-subtitle">
                        Registeration of new user accounts has been disabled by the server
                        administrator
                    </h3>
                    <div class="login-signup">
                        <a href="/login">Go back to log in</a>
                    </div>
                </div>
            </div>

            <!-- Footer Text -->
            <div class="info-footer">
                <div class="info-version">
                    <a href="https://exoserve.ciphranova.com" target="_blank">ExoServe v1.0</a>
                </div>
                <div class="info-copyright">
                    Owned by <a href="https://ciphranova.com" target="_blank">Ciphranova LLC</a>
                </div>
            </div>
        </div>
    </body>
</html>
