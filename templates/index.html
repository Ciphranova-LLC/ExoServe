{% extends "base.html" %}

{% block title %}ExoServe{% endblock %}

{% block content %}
<!-- The main layout containing all elements-->
<div class="layout-main">

    <!-- Sidebar Menu -->
    <nav class="sidebar-root">
        <img src="static/img/favicon.png"/>

        <hr/>

        <div class="button" onclick="setSessionKey()" title="Set Key">
            <img src="static/img/key-set.svg"/>
        </div>

        <div class="button" onclick="generateAndDownloadKey()" title="Generate Key">
            <img src="static/img/key-new.svg"/>
        </div>

        <hr/>

        <div class="button" onclick="" title="Trash">
            <img src="static/img/trashcan.svg"/>
        </div>
    </nav>

    <!-- Nested layout to contain session-specific details -->
    <main class="layout-session">

        <!-- Search bar -->
        <div class="area-search">
            <input type="text" placeholder="Search...">
            <pre id="key-name">No key set</pre>
        </div>

        <!-- Interaction buttons -->
        <div class="area-button">
            <div class="button" onclick="uploadFile()" title="Upload">
                <img src="static/img/arrow-up.svg"/>
                Upload
            </div>
            <div class="button" onclick="uploadFolder()" title="New folder">
                <img src="static/img/new-folder.svg"/>
                New folder
            </div>

            <vr></vr>

            <div class="button" onclick="" title="Download">
                <img src="static/img/arrow-down.svg"/>
                Download
            </div>
        </div>

        <!-- Breadcrumb -->
        <div class="area-breadcrumb">
            <nav class="breadcrumbs">
                <ol id="breadcrumb-list">
                    <li class="crumb" data-path="/"><span>Home</span></li>
                </ol>
            </nav>
        </div>

        <!-- File table -->
        <div class="area-files">
            <div id="folder-list" class="file-table"></div>
        </div>
    </main>

</div>

<!-- Preview dialog -->
 <dialog id="preview-modal" class="modal-root">
    <form method="dialog" class="modal-header">
        <button class="button-close" title="Close Preview">&#x26CC</button>
    </form>
    
    <div id="file-preview" class="preview"></div>
</dialog>

{% endblock %}
