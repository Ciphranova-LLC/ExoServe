<!-- New Folder dialog-->
<dialog id="modal-newfolder" class="modal-root modal-sm">
    <form method="dialog" class="modal-header">
        <button class="button-close" title="Cancel">&#x2715;</button>
    </form>
    <div class="modal-body">
        <h2 style="text-align:left;padding-left:5px;">New Folder</h2>
        <input type="text" id="newfolder-name" placeholder="Folder Name">
    </div>
    <footer>
        <div class="button" onclick="ui_closeNewFolderModal()">Cancel</div>
        <div class="button" onclick="ui_submitNewFolderModal()">Create</div>
    </footer>
</dialog>
