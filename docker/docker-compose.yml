services:
  exoserve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exoserve
    ports:
      - "8000:8000"
    environment:
      - EXOSERVE_IP=0.0.0.0
      - EXOSERVE_PORT=8000
      - EXOSERVE_WORKERS=2
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s